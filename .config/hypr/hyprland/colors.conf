
general {
    col.active_border = rgba(4955A2AA)
    col.inactive_border = rgba(C4C3C830)
}

misc {
    background_color = rgba(C4C3C8FF)
}

plugin {
    hyprbars {
        # Honestly idk if it works like css, but well, why not
        bar_text_font = Rubik, Geist, AR One Sans, Reddit Sans, Inter, Roboto, Ubuntu, Noto Sans, sans-serif
        bar_height = 30
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true

        bar_color = rgba(8F523DAA)
        col.text = rgba(544444FF)


        # example buttons (R -> L)
        #hyprbars-button = color, size, on-click
        hyprbars-button = rgba(4955A2FF), 13, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgba(4955A2FF), 13, 󰖯, hyprctl dispatch fullscreen 1
        hyprbars-button = rgba(4955A2FF), 13, 󰖰, hyprctl dispatch movetoworkspacesilent special
    }
}

windowrulev2 = bordercolor rgba(4955A2AA) rgba(211F2CAA),pinned:1
