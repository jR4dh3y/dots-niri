# Global color palette - Reference for manual color definitions
# This file serves as documentation for the color scheme used throughout the dotfiles
# Format: VARIABLE_NAME = hex_value (Name: Description)

bg_color = #1A1B26 (Background: Main background color)
fg_color = #C0CAF5 (Foreground: Main text color)
