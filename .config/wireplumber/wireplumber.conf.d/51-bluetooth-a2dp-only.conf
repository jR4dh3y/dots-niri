# Permanent A2DP-only policy for Airdopes-class TWS on MT7921.
# Keep this simple — extra bluez5 props have broken sink creation before.
wireplumber.settings = {
  bluetooth.use-persistent-storage = false
  bluetooth.autoswitch-to-headset-profile = false
  bluetooth.profile-preference = quality
}

monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source ]
  bluez5.hfphsp-backend = "none"
  bluez5.enable-msbc = false
  bluez5.enable-hw-volume = true
}

monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.pause-on-idle = false
      }
    }
  }
]
