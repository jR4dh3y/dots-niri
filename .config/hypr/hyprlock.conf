
$font_family = JetBrainsMono Nerd Font
$font_family_clock = JetBrainsMono Nerd Font Bold

$text_color = rgba(192, 202, 245, 1.0)
$accent_color = rgba(122, 162, 247, 1.0)
$accent_color_soft = rgba(122, 162, 247, 0.8)
$entry_background_color = rgba(26, 27, 38, 0.6)
$entry_border_color = rgba(122, 162, 247, 1.0)
$entry_color = rgba(192, 202, 245, 1.0)
$check_color = rgba(158, 206, 106, 1.0)
$fail_color = rgba(247, 118, 142, 1.0)
$caps_color = rgba(224, 175, 104, 1.0)
$network_color = rgba(125, 207, 255, 0.8)
$battery_color = rgba(158, 206, 106, 0.8)
$status_color = rgba(192, 202, 245, 0.5)
$user_color = rgba(192, 202, 245, 0.8)


general {
    grace = 1
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fractional_scaling = 2
    fail_timeout = 2000
}


auth {
    pam:enabled = true
    fingerprint:enabled = false
}


background {
    monitor =
    path = /home/radhey/.local/share/wallpapers/vicodin.png
    blur_size = 8
    blur_passes = 3
    brightness = 0.4
    contrast = 1.0
    # vibrancy = 0.3
    vibrancy_darkness = 0.6
    noise = 0.012
}

# Main input field
input-field {
    monitor =
    size = 350px, 60px
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = false
    fade_timeout = 2000
    placeholder_text = 󰌾 Enter Password
    hide_input = false
    check_color = $check_color
    fail_color = $fail_color
    fail_text = $FAIL ($ATTEMPTS)
    capslock_color = $caps_color
    position = 0px, -150px
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo $(date '+%H:%M:%S')
    color = $text_color
    font_size = 90
    font_family = $font_family_clock
    position = 0, 250
    halign = center
    valign = center
    # shadow_passes = 2
    # shadow_size = 3
    # shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo $(date '+%A, %B %d, %Y')
    color = $accent_color
    font_size = 22
    font_family = $font_family
    position = 0, 150
    halign = center
    valign = center
    # shadow_passes = 2
    # shadow_size = 3
}

# Battery status (if available)
label {
    monitor =
    text = cmd[update:5000] if command -v acpi >/dev/null 2>&1; then pct=$(acpi -b | grep -oP '[0-9]+(?=%)' | head -1); if [ -n "$pct" ]; then printf '  %s%%' "$pct"; fi; fi
    color = $battery_color
    font_size = 14
    font_family = $font_family
    position = 30, 30
    halign = left
    valign = bottom
}

# Network status
label {
    monitor =
    text = cmd[update:5000] if command -v nmcli >/dev/null 2>&1; then ssid=$(nmcli -t -f active,ssid dev wifi | awk -F: '$1=="yes" {print $2; exit}'); if [ -n "$ssid" ]; then printf '  %s' "$ssid"; else printf '  Disconnected'; fi; fi
    color = $network_color
    font_size = 14
    font_family = $font_family
    position = -30, 30
    halign = right
    valign = bottom
}
path = /home/radhey/.local/share/wallpapers/vicodin.png
