# Swaylock Beautiful Configuration - Dynamic Wallpaper Colors
# Generated from wallpaper colors by wallust

# Basic settings
ignore-empty-password
show-failed-attempts
show-keyboard-layout
daemonize

# Use current wallpaper as background
image={{wallpaper}}
scaling=fill

# Enhanced blur and dim effects for beautiful lock screen
effect-blur=10x3
effect-scale=0.5
effect-vignette=0.4:0.8
effect-pixelate=5

# Clock display
clock
timestr=%I:%M %p
datestr=%A, %B %d

# Indicator positioning and size
indicator
indicator-radius=120
indicator-thickness=12
indicator-caps-lock
indicator-idle-visible

# Inside of indicator (circle) - semi-transparent
inside-color={{color0 | strip}}88
inside-clear-color={{color6 | strip}}88
inside-caps-lock-color={{color3 | strip}}88
inside-ver-color={{color4 | strip}}88
inside-wrong-color={{color1 | strip}}88

# Ring colors - vibrant from wallpaper
ring-color={{color8 | strip}}88
ring-clear-color={{color6 | strip}}
ring-caps-lock-color={{color3 | strip}}
ring-ver-color={{color4 | strip}}
ring-wrong-color={{color1 | strip}}

# Line (separator) - transparent for modern look
line-color=00000000
line-clear-color=00000000
line-caps-lock-color=00000000
line-ver-color=00000000
line-wrong-color=00000000

# Text colors
text-color={{color7 | strip}}
text-clear-color={{color0 | strip}}
text-caps-lock-color={{color0 | strip}}
text-ver-color={{color0 | strip}}
text-wrong-color={{color0 | strip}}

# Key highlight (when typing)
key-hl-color={{color2 | strip}}

# Backspace highlight
bs-hl-color={{color1 | strip}}

# Separator color - transparent
separator-color=00000000

# Layout text colors
layout-bg-color=00000000
layout-text-color={{color7 | strip}}AA

# Smooth fade in animation
fade-in=0.3

# Grace period (seconds before requiring password)
grace=2
grace-no-mouse
grace-no-touch
